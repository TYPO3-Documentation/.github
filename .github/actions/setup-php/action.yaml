name: Setup PHP
description: Install PHP with TYPO3 defaults

inputs:
  php-version:
    required: true
  php-extensions:
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install PHP
      uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
      with:
        coverage: none
        php-version: ${{ inputs.php-version }}
        extensions: ${{ inputs.php-extensions }}