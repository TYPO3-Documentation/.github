name: Node Command
on:
  workflow_call:
    inputs:
      command:
        description: 'Command to run after the install command; must be a static literal, never pass github.event.* data'
        type: string
        required: true
      working-directory:
        description: 'Directory containing package.json'
        type: string
        default: '.'
      node-version-file:
        description: 'File to read the Node.js version from (e.g. .nvmrc), relative to the repository root'
        type: string
        default: ''
      node-version:
        description: 'Node.js version (leave empty when node-version-file is used; without either, the runner default Node.js is used)'
        type: string
        default: ''
      install-command:
        description: 'Dependency install command; must be a static literal, never pass github.event.* data'
        type: string
        default: 'npm ci --no-progress'
      cache:
        description: 'Dependency cache: auto (default) caches via npm only when the lock file exists; npm/yarn/pnpm force it; empty string disables'
        type: string
        default: 'auto'
      cache-dependency-path:
        description: 'Lock file path for the cache key; defaults to the manager''s lock file (e.g. yarn.lock) in working-directory'
        type: string
        default: ''

jobs:
  run:
    name: Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Resolve dependency cache
        id: cache
        working-directory: ${{ github.workspace }}
        env:
          CACHE_INPUT: ${{ inputs.cache }}
          CUSTOM_PATH: ${{ inputs.cache-dependency-path }}
          WORKDIR: ${{ inputs.working-directory }}
        run: |
          manager="$CACHE_INPUT"
          if [ "$CACHE_INPUT" = "auto" ]; then
            manager="npm"
          fi
          case "$manager" in
            npm)  lockfile="package-lock.json" ;;
            yarn) lockfile="yarn.lock" ;;
            pnpm) lockfile="pnpm-lock.yaml" ;;
            *)    lockfile="" ;;
          esac
          path="$CUSTOM_PATH"
          if [ -z "$path" ] && [ -n "$lockfile" ]; then
            path="$WORKDIR/$lockfile"
          fi
          if [ "$CACHE_INPUT" = "auto" ] && ! compgen -G "$path" > /dev/null; then
            manager=""
            path=""
          elif [ -z "$CACHE_INPUT" ]; then
            manager=""
            path=""
          fi
          echo "manager=$manager" >> "$GITHUB_OUTPUT"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          node-version: ${{ inputs.node-version }}
          cache: ${{ steps.cache.outputs.manager }}
          cache-dependency-path: ${{ steps.cache.outputs.path }}

      # Command inputs are code by contract: they are set in the calling
      # repository's committed workflow file, the same trust level as the code.
      - name: Install dependencies
        run: ${{ inputs.install-command }} # zizmor: ignore[template-injection]

      - name: Run command
        run: ${{ inputs.command }} # zizmor: ignore[template-injection]
