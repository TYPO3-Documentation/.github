name: PHP Quality
on:
  workflow_call:
    inputs:
      php-version:
        description: 'PHP version for quality checks'
        type: string
        default: '8.2'
      run-cs-fixer:
        description: 'Run PHP CS Fixer'
        type: boolean
        default: true
      cs-fixer-command:
        description: 'CS Fixer command'
        type: string
        default: 'make test-cs-fixer'
      run-phpstan:
        description: 'Run PHPStan'
        type: boolean
        default: true
      phpstan-command:
        description: 'PHPStan command'
        type: string
        default: 'make test-phpstan'
      run-xml-lint:
        description: 'Run XML lint'
        type: boolean
        default: false
      xml-lint-command:
        description: 'XML lint command'
        type: string
        default: 'make test-xml-lint'
      php-extensions:
        description: 'PHP extensions to install'
        type: string
        default: ''
      run-environment:
        description: 'RUN_ENVIRONMENT value'
        type: string
        default: 'local'

jobs:
  quality:
    permissions:
      contents: read
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          coverage: none
          php-version: "${{ inputs.php-version }}"
          extensions: "${{ inputs.php-extensions }}"

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: php-${{ inputs.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: php-${{ inputs.php-version }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # Command inputs are code by contract: they are set in the calling
      # repository's committed workflow file, the same trust level as the code.
      - name: PHP CS Fixer
        if: inputs.run-cs-fixer
        run: ${{ inputs.cs-fixer-command }} # zizmor: ignore[template-injection]
        env:
          RUN_ENVIRONMENT: ${{ inputs.run-environment }}

      - name: PHPStan
        if: inputs.run-phpstan
        run: ${{ inputs.phpstan-command }} # zizmor: ignore[template-injection]
        env:
          RUN_ENVIRONMENT: ${{ inputs.run-environment }}

      - name: XML Lint
        if: inputs.run-xml-lint
        run: ${{ inputs.xml-lint-command }} # zizmor: ignore[template-injection]
        env:
          RUN_ENVIRONMENT: ${{ inputs.run-environment }}
