name: PHP Command
on:
  workflow_call:
    inputs:
      php-version:
        description: 'PHP version'
        type: string
        default: '8.2'
      command:
        description: 'Command to run after composer install'
        type: string
        required: true
      php-extensions:
        description: 'PHP extensions to install'
        type: string
        default: ''
      composer-args:
        description: 'Additional composer install arguments'
        type: string
        default: '--no-interaction --no-progress --prefer-dist'
      run-environment:
        description: 'RUN_ENVIRONMENT value'
        type: string
        default: 'local'

jobs:
  run:
    name: Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          coverage: none
          php-version: "${{ inputs.php-version }}"
          extensions: "${{ inputs.php-extensions }}"

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: php-${{ inputs.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: php-${{ inputs.php-version }}-composer-

      - name: Install dependencies
        env:
          COMPOSER_ARGS: ${{ inputs.composer-args }}
        run: |
          # shellcheck disable=SC2086 # COMPOSER_ARGS is a flag list, word splitting is intended
          composer install $COMPOSER_ARGS

      # Command inputs are code by contract: they are set in the calling
      # repository's committed workflow file, the same trust level as the code.
      - name: Run command
        run: ${{ inputs.command }} # zizmor: ignore[template-injection]
        env:
          RUN_ENVIRONMENT: ${{ inputs.run-environment }}
