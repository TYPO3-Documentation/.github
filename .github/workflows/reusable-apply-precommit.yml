name: Reusable Fix Whitespace

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version used for pre-commit"
        required: false
        type: string
        default: "3.x"

      branch:
        description: "Branch used for the generated pull request"
        required: false
        type: string
        default: "fix/whitespace"

      commit-message:
        description: "Commit message for whitespace fixes"
        required: false
        type: string
        default: "fix: apply whitespace fixes"

      pr-title:
        description: "Pull request title"
        required: false
        type: string
        default: "Fix whitespace issues"

      pr-body:
        description: "Pull request body"
        required: false
        type: string
        default: "This PR automatically applies whitespace fixes."

    secrets:
      APP_CLIENT_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true

jobs:
  fix-whitespace:
    if: github.repository_owner == 'TYPO3-documentation'

    permissions:
      contents: read

    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit hooks and apply fixes
        run: |
          pre-commit run --all-files --hook-stage=manual --show-diff-on-failure || true

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: ${{ inputs.commit-message }}
          branch: ${{ inputs.branch }}
          delete-branch: true
          title: ${{ inputs.pr-title }}
          body: ${{ inputs.pr-body }}